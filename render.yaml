services:
  - type: web
    name: observatorio-mortalidad-colombia
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /
    autoDeployTrigger: commit
