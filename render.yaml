services:
  - type: web
    name: observatorio-mortalidad-colombia
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.app:server --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /
    autoDeployTrigger: commit
